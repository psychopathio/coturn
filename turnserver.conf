listening-port=3478
tls-listening-port=5349
dtls-listening-port=5349
min-port=49152
max-port=65535

fingerprint
lt-cred-mech
user=user:pass
or
use-auth-secret
static-auth-secret=very-long-seceret

external-ip=myip
relay-ip=myip
listening-ip=0.0.0.0

server-name=domain
realm=rtc.domain

log-file=/var/log/turnserver.log
simple-log
verbose

total-quota=100
stale-nonce=600

total-quota=0
bps-capacity=0

cert=/etc/letsencrypt/live/domain/fullchain.pem
pkey= /etc/letsencrypt/live/domain/privkey.pem
cipher-list="ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384"

no-udp
no-cli
no-tlsv1
no-tlsv1_1
no-tlsv1_2

no-loopback-peers
no-multicast-peers

cli-password=very-long-password
